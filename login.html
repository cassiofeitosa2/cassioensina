<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Cássio Ensina</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 80% 20%, rgba(61,145,255,.35), transparent 30%),
        linear-gradient(135deg,#0d2447,#173b75,#1769aa);
      padding: 24px;
    }

    .login-box {
      width: 100%;
      max-width: 430px;
      background: rgba(255,255,255,.97);
      border-radius: 24px;
      padding: 36px;
      box-shadow: 0 30px 80px rgba(0,0,0,.25);
    }

    .brand {
      font-size: 26px;
      font-weight: 800;
      color: #173b75;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #68748a;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 700;
      color: #253149;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      margin-bottom: 18px;
      border: 1px solid #d9dfeb;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #2b6ec9;
      box-shadow: 0 0 0 3px rgba(43,110,201,.12);
    }

    button {
      width: 100%;
      border: 0;
      background: #173b75;
      color: white;
      padding: 14px;
      border-radius: 12px;
      font-weight: 800;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      background: #0f2f61;
    }

    .back {
      margin-top: 20px;
      text-align: center;
    }

    .back a {
      color: #2b6ec9;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
    }

    .note {
      margin-top: 20px;
      padding: 12px;
      background: #eef5ff;
      border-radius: 10px;
      font-size: 12px;
      line-height: 1.5;
      color: #536078;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="brand">Cássio Ensina</div>

    <p class="subtitle">
      Acesse sua central privada de materiais, aplicativos e ferramentas.
    </p>

    <form onsubmit="entrar(event)">

      <label for="email">E-mail</label>
      <input type="email" id="email" placeholder="seu@email.com" required>

      <label for="senha">Senha</label>
      <input type="password" id="senha" placeholder="Digite sua senha" required>

      <button type="submit">Entrar</button>

    </form>

    <div class="note">
      Esta tela ainda é apenas visual. No próximo passo vamos conectá-la ao Supabase para ter autenticação real.
    </div>

    <div class="back">
      <a href="/">← Voltar ao site</a>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL = "https://veyygrhnqiexwadxrexq.supabase.co";
  const SUPABASE_KEY = "sb_publishable_8f8pndhzNkBRbP2wVGPt6g_rXAJcdGz";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  async function entrar(event) {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const senha = document.getElementById("senha").value;

    const botao = event.target.querySelector("button");
    botao.disabled = true;
    botao.textContent = "Entrando...";

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: senha
      });

    if (error) {
      alert("Não foi possível entrar. Verifique o e-mail e a senha.");
      botao.disabled = false;
      botao.textContent = "Entrar";
      return;
    }

    window.location.href = "/central.html";
  }

  async function verificarLogin() {
    const { data } = await supabaseClient.auth.getSession();

    if (data.session) {
      window.location.href = "/central.html";
    }
  }

  verificarLogin();
</script>

</body>
</html>
